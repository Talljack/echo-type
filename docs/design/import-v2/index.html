<style>
:root{--ink:#202541;--muted:#626c82;--primary:#4f46e5;--wash:#eef2ff;--line:#e4e7ef;--green:#177348;--amber:#925d13}*{box-sizing:border-box}body{margin:0;background:#eef0f5;color:var(--ink);font:14px/1.6 'Open Sans','Avenir Next','Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button,a,input,select,textarea{touch-action:manipulation}button{cursor:pointer;border:0;border-radius:8px;min-height:42px;padding:8px 15px;background:#eef0f6;color:var(--ink);transition:transform .12s,opacity .12s}button:active{transform:scale(.96)}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,a:focus-visible{outline:3px solid #818cf8;outline-offset:3px}input,select,textarea{width:100%;border:1px solid #d8ddea;border-radius:8px;padding:10px 12px;background:white;color:var(--ink)}textarea{resize:vertical}input:focus,textarea:focus,select:focus{outline:2px solid #818cf8;outline-offset:1px}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:'Poppins','Avenir Next','Segoe UI',sans-serif}h1{font-size:23px;letter-spacing:-.5px}h2{font-size:20px}h3{font-size:15px}.muted{color:var(--muted)}.small{font-size:12px}.primary{background:var(--primary);color:white}.ghost{background:transparent}.outline{background:white;box-shadow:inset 0 0 0 1px #d8ddea}.pill{display:inline-flex;padding:3px 9px;background:var(--wash);color:#4338ca;border-radius:6px;font-size:12px}.good{color:var(--green)}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.stack{display:grid;gap:16px}.brand{font:700 23px 'Poppins','Avenir Next',sans-serif;letter-spacing:-.6px}.brand span{color:var(--primary)}.shell{max-width:1280px;margin:auto;padding:28px 32px}.shell-head{display:flex;align-items:center;justify-content:space-between}.shell h2{margin-top:32px}.library-row{display:flex;justify-content:space-between;margin-top:20px;background:white;padding:22px;border-radius:12px}.scrim{position:fixed;inset:0;background:rgba(32,37,65,.23);display:flex;align-items:center;justify-content:center;padding:64px 24px 22px}.prototype{position:fixed;inset:0 0 auto;background:#242842;color:#fff;min-height:42px;display:flex;align-items:center;justify-content:center;gap:12px;z-index:3;padding:5px 12px;font-size:12px}.prototype button{min-height:28px;padding:2px 9px;color:#fff;background:#3c4264}.modal{width:1120px;max-width:100%;height:min(790px,calc(100dvh - 95px));background:white;border-radius:16px;box-shadow:0 24px 80px #20254130;display:flex;flex-direction:column;overflow:hidden}.header{padding:22px 28px 0}.eyebrow{font-size:11px;letter-spacing:1.2px;color:var(--primary);font-weight:700}.close{font-size:24px;padding:0;min-width:42px}.steps{display:flex;gap:24px;margin-top:20px;list-style:none;padding:0}.steps li{font-size:13px;color:#71798b;display:flex;align-items:center;gap:7px;padding-bottom:14px;border-bottom:2px solid transparent}.steps li.active{color:var(--primary);font-weight:600;border-color:var(--primary)}.steps b{display:grid;place-items:center;font-size:11px;border-radius:50%;width:21px;height:21px;background:#f0f2f7}.steps .active b{background:var(--primary);color:white}.body{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--line);overscroll-behavior:contain}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 28px;border-top:1px solid var(--line);background:white}.footer .actions{display:flex;gap:8px;margin-left:auto}.source{display:grid;grid-template-columns:180px 1fr;height:100%}.sources{background:#f2f4f9;padding:24px 16px}.sources button{width:100%;text-align:left;margin-bottom:8px;background:transparent}.sources button.active{background:white;color:var(--primary);box-shadow:0 1px 4px #20254118}.sources p{margin:20px 10px;font-size:12px;color:var(--muted)}.content{padding:25px 28px}.drop{margin:18px 0;min-height:200px;border:1px dashed #a7afe7;border-radius:12px;background:#f8f9ff;display:grid;place-content:center;text-align:center;gap:9px;padding:24px}.drop strong{font-size:18px}.drop svg{margin:0 auto;color:var(--primary)}.filetypes{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;color:var(--muted);font-size:12px}.filetypes b{color:var(--ink);display:block}.notice{padding:12px 14px;background:#fff7e8;color:var(--amber);border-radius:8px;font-size:13px}.queue{margin-top:16px}.item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}.file-icon{width:39px;height:46px;background:var(--wash);display:grid;place-items:center;border-radius:6px;color:var(--primary);font-weight:700;font-size:10px}.item .info{flex:1}.source textarea{min-height:220px;margin-top:16px}.processing{max-width:730px;margin:0 auto;padding:32px}.progress{height:5px;background:#edf0f6;border-radius:6px;margin:18px 0}.progress span{display:block;width:66%;height:100%;background:var(--primary);border-radius:6px}.review{display:grid;grid-template-columns:178px minmax(0,1fr) 246px;min-height:100%}.chapters{padding:20px 12px;background:#f4f5fa}.chapters .small{padding:0 10px 12px;display:block}.chapters button{display:block;text-align:left;width:100%;background:transparent;font-size:12px;margin-bottom:5px}.chapters button.active{color:var(--primary);background:#e8ebff}.editor{padding:23px 26px;min-width:0}.editor-toolbar{padding-bottom:16px;display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid var(--line)}.reading{font:17px/1.95 Georgia,'Times New Roman',serif;color:#313750;margin-top:22px;min-height:210px;outline-offset:6px}.reading p{margin-bottom:16px}.properties{padding:22px 20px;background:#f5f6fa}.properties label{display:block;font-size:12px;font-weight:600;margin-bottom:17px}.properties input,.properties select{margin-top:6px;font-weight:400}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.tag{background:#e8ebff;color:#4338ca;border-radius:6px;font-size:12px;min-height:30px;padding:3px 8px}.properties details{border-top:1px solid #dfe3ef;padding-top:14px;font-size:12px}.properties summary{cursor:pointer;min-height:36px}.editor table{width:100%;border-collapse:collapse;margin-top:20px}.editor td,.editor th{border-bottom:1px solid var(--line);padding:10px;text-align:left;font-size:13px}.editor td[contenteditable]{background:#fafbfe}.dialogue-line{display:grid;grid-template-columns:65px 1fr;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}.done{max-width:650px;margin:38px auto;padding:0 24px}.done .seal{background:#e5f4eb;color:var(--green);width:48px;height:48px;display:grid;place-items:center;border-radius:50%;font-size:24px;margin-bottom:16px}.done .course{padding:20px 0;margin-top:20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.flow{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.flow span{font-size:12px;background:#f0f2f8;padding:4px 9px;border-radius:6px}.simulation{font-size:11px;color:#797e91}.mobile-only{display:none}a{color:var(--primary)}@media(max-width:760px){.prototype{justify-content:flex-start;overflow:auto;white-space:nowrap}.prototype .desc{display:none}.scrim{padding:42px 0 0}.modal{height:calc(100dvh - 42px);border-radius:0;width:100%}.header{padding:17px 18px 0}h1{font-size:20px}.steps{gap:12px;margin-top:14px;justify-content:space-between}.steps li{font-size:11px;gap:4px}.steps b{width:18px;height:18px}.footer{padding:12px 16px}.footer>.small{display:none}.source{display:block}.sources{padding:8px 12px;display:flex;gap:5px}.sources button{margin:0;text-align:center;padding:7px;white-space:nowrap}.sources p{display:none}.content{padding:20px 18px}.drop{min-height:185px}.filetypes{gap:12px}.review{display:flex;flex-direction:column}.chapters{display:flex;overflow:auto;padding:10px;gap:4px}.chapters .small{display:none}.chapters button{white-space:nowrap;width:auto;margin:0}.editor{padding:18px}.properties{padding:20px}.properties label{margin-bottom:14px}.reading{font-size:16px}.processing{padding:24px 18px}.editor-toolbar{align-items:flex-start}.editor-toolbar .pill{display:none}.done{margin:25px auto}.item{gap:9px}.item button{padding:6px 9px}.shell{padding:20px}.mobile-only{display:block}.properties .stack{grid-template-columns:1fr 1fr}.properties .stack label{min-width:0}.prototype button{flex-shrink:0}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<div class="prototype"><span class="desc">设计稿 V2 · 示例数据 / 无实际上传</span><button onclick="go(0)">添加来源</button><button onclick="go(1)">处理状态</button><button onclick="go(2)">校对材料</button><button onclick="go(3)">导入完成</button><button onclick="failed=true;go(1)">失败恢复</button></div>
<main class="shell"><div class="shell-head"><div class="brand">Echo<span>Type</span></div><span class="muted">Today / My courses / Learning materials</span></div><h2>学习材料</h2><p class="muted">你的每一份材料，都能成为下一次练习。</p><div class="library-row"><span>阅读 · 英文书籍 <b>12</b></span><button class="primary" onclick="document.querySelector('.scrim').style.display='flex'">＋ 添加材料</button></div><div class="library-row">词书 <b>8</b></div><div class="library-row">视频 · 对话 · 句集 · 场景</div></main>
<div class="scrim"><section class="modal" role="dialog" aria-modal="true" aria-label="添加学习材料"><header class="header"><div class="row between"><div><div class="eyebrow">ECHOTYPE / LEARNING MATERIALS</div><h1>添加学习材料</h1></div><button class="ghost close" aria-label="关闭设计弹窗" onclick="document.querySelector('.scrim').style.display='none'">×</button></div><ol class="steps"></ol></header><div class="body" id="body"></div><footer class="footer" id="footer"></footer></section></div>
<script>
let step=0,source='file',kind='reading',failed=false,added=false,chapter=0;const names=['添加来源','处理材料','校对与整理','开始学习'];const typeNames={reading:'阅读 · 英文书籍',wordbook:'词书',video:'视频',dialogue:'对话',sentences:'句集',scenario:'场景'};const fileNames={reading:'The Little Prince.epub',wordbook:'Travel vocabulary.csv',video:'A day in London.mp4',dialogue:'Coffee conversation.txt',sentences:'Everyday expressions.srt',scenario:'Hotel check-in.md'};const uploadIcon='<svg width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/></svg>';
function go(n){step=n;render();document.getElementById('body').scrollTop=0}function setSource(s){source=s;render()}function setKind(s){kind=s;chapter=0;render()}function example(){added=true;render()}function footer(note,actions){document.getElementById('footer').innerHTML='<span class="small muted">'+note+'</span><div class="actions">'+actions+'</div>'}function row(name,status,action=''){return '<div class="item"><div class="file-icon">'+name.split('.').pop().toUpperCase()+'</div><div class="info"><strong>'+name+'</strong><div class="small muted">'+status+'</div></div>'+action+'</div>'}
function render(){document.querySelector('.steps').innerHTML=names.map((n,i)=>'<li class="'+(i===step?'active':'')+'"><b>'+(i<step?'✓':i+1)+'</b>'+n+'</li>').join('');let b='';if(step===0){b='<div class="source"><aside class="sources">'+[['file','上传文件'],['text','粘贴文本'],['url','粘贴链接']].map(([s,n])=>'<button class="'+(source===s?'active':'')+'" onclick="setSource(\''+s+'\')">'+n+'</button>').join('')+'<p>先带来材料，<br>再决定怎么学习。<br><br>保留原始内容，<br>校对后才加入资料库。</p></aside><div class="content">';if(source==='file'){b+='<div class="row between"><h2>把想学的文件放进来</h2><span class="pill">自动识别格式</span></div><div class="drop">'+uploadIcon+'<strong>拖入文件，或点击选择</strong><span class="muted">书籍、词表、文档、字幕、音视频</span><button class="primary" onclick="example()">选择文件 · 示例演示</button><span class="small muted">可多选；视频与同名字幕自动配对（规划）</span></div><div class="filetypes"><div><b>文档与英文书籍</b>TXT · MD · PDF · DOCX · EPUB / 20 MB</div><div><b>词书与字幕</b>CSV · TSV / 20 MB　SRT · VTT / 10 MB</div><div><b>视频与音频来源</b>MP4 · WebM · AVI · MP3 · WAV 等 / 25 MB</div><div><b>扩展支持 · 规划</b>XLSX · JSON · 图片 OCR · 扫描版 PDF</div></div>';if(added)b+='<div class="queue">'+row(fileNames[kind],'已检查 · 等待处理','<button class="ghost" onclick="added=false;render()">移除</button>')+'</div>';}else if(source==='text'){b+='<h2>粘贴你真正想练习的内容</h2><p class="muted">文章、对话、句子、带释义的词表，都可以从这里开始。</p><textarea aria-label="粘贴内容" placeholder="在这里粘贴英文内容…" oninput="added=!!this.value.trim();document.getElementById(\'next\').disabled=!added">'+(added?'Anna: Could I have a coffee, please?\nBen: Of course. Would you like milk?':'')+'</textarea><div class="row between"><span class="small muted">保留换行与标点 · 自动建议材料类型</span><button class="ghost" onclick="added=true;kind=\'dialogue\';render()">填入示例</button></div><p class="small muted" style="margin-top:25px">无需先填写标题和标签；下一步会根据内容给出建议，随时可改。</p>';}else{b+='<h2>从一篇文章或一个视频开始</h2><p class="muted">网页提取正文；YouTube 优先读取可获取的字幕。</p><input style="margin-top:22px" aria-label="来源链接" placeholder="https://…" oninput="added=!!this.value.trim();document.getElementById(\'next\').disabled=!added"><div class="notice" style="margin-top:22px">部分网页需要登录，视频字幕也可能无法获取。失败时可在同一任务中补充正文或字幕，保留来源链接。</div><p class="small muted" style="margin-top:18px">不会仅凭抓取失败就断言视频没有字幕。</p>';}b+='</div></div>';footer('格式与大小在开始处理前检查','<button class="primary" id="next" '+(!added?'disabled':'')+' onclick="go('+(source==='text'?2:1)+')">'+(source==='text'?'校对内容':'开始处理')+' →</button>');}else if(step===1){b='<div class="processing"><div class="row between"><h2>'+(failed?'这份材料需要你补充一下':'正在准备学习内容')+'</h2><span class="pill">'+(failed?'1 项待处理':'2 / 3 已完成')+'</span></div><p class="muted" style="margin-top:8px">'+(failed?'已保留来源，可以继续完成这次导入。':'各文件独立处理，完成的材料可以先开始校对。')+'</p><div class="progress"><span style="width:'+(failed?'45':'66')+'%"></span></div>'+row(fileNames[kind],failed?'字幕未获取：可能是访问限制、网络或字幕不可用':'正文提取完成 · 27 个章节 · 原文件已保留','<span class="good">'+(failed?'待补充':'✓')+'</span>');if(failed)b+='<div class="notice" style="margin-top:20px">自动获取暂未成功。你可以重试，或补充已有的文本/字幕来继续；不会丢失来源。</div><div class="row" style="flex-wrap:wrap;margin-top:18px"><button class="outline" onclick="failed=false;render()">重试获取</button><button class="outline" onclick="source=\'text\';added=true;go(0)">补充文本</button><button class="outline" onclick="failed=false;kind=\'video\';go(2)">添加 SRT / VTT · 示例</button></div>';else b+=row('London.mp4 + London.srt','已配对 · 使用字幕，无需 AI 转写','<span class="good">✓</span>')+row('Team meeting.m4a','等待确认 AI 转写 · 约 4 分钟','<button class="outline" onclick="this.textContent=\'已选择稍后处理\'">稍后处理</button>')+'<div class="notice" style="margin-top:22px">音频需要 AI 转写，确认后才调用你配置的服务商。转写完成后整理为句集或场景，可能产生服务商费用。</div>';b+='<p class="simulation" style="margin-top:28px">设计演示：批量队列与字幕配对为新增规划；进度展示实际阶段，不虚构百分比。</p></div>';footer('可关闭弹窗；后台处理与恢复能力按平台实现','<button class="ghost" onclick="go(0)">返回来源</button><button class="primary" onclick="failed=false;go(2)">校对已完成材料 →</button>');}else if(step===2){b='<div class="review"><aside class="chapters"><span class="small muted">'+(kind==='reading'?'章节目录 · 27':typeNames[kind]+' · 内容目录')+'</span>'+[kind==='reading'?'01　The drawing':'01　内容预览',kind==='reading'?'02　An encounter':'02　下一段',kind==='reading'?'03　The little prince':'03　更多内容'].map((c,i)=>'<button class="'+(chapter===i?'active':'')+'" onclick="chapter='+i+';render()">'+c+'</button>').join('')+'<p class="small muted" style="padding:12px">切换章节保留编辑<br>发布范围：全部章节</p></aside><article class="editor"><div class="editor-toolbar"><div><h3>'+({reading:['The drawing','An encounter','The little prince'][chapter],wordbook:'Travel vocabulary',video:'A day in London',dialogue:'At the coffee shop',sentences:'Everyday expressions',scenario:'Hotel check-in'}[kind])+'</h3><span class="small muted">原始版本已保留 · 可直接编辑</span></div><span class="pill">'+(kind==='reading'?'第 '+(chapter+1)+' / 27 章':'内容校对')+'</span></div>';if(kind==='wordbook')b+='<p class="small muted" style="margin-top:15px">列映射：word → 单词 / meaning → 释义 / example → 例句</p><table><thead><tr><th>单词</th><th>释义</th><th>例句</th></tr></thead><tbody><tr><td contenteditable>journey</td><td contenteditable>旅程</td><td contenteditable>Enjoy the journey.</td></tr><tr><td contenteditable>explore</td><td contenteditable>探索</td><td contenteditable>Explore a new city.</td></tr></tbody></table><p class="notice" style="margin-top:20px">2 条完全重复，默认跳过；不同释义保留。发布前可查看具体词条。</p>';else if(kind==='dialogue'||kind==='video'||kind==='sentences'){b+='<p class="small muted" style="margin-top:18px">'+(kind==='video'?'播放器区域 · 与下方字幕同步（设计占位）':'逐句校对，保留说话人与原始顺序')+'</p>'+['Could I have a coffee, please?','Of course. Would you like milk?','Yes, just a little. Thank you.'].map((s,i)=>'<div class="dialogue-line"><span class="small muted">'+(kind==='video'?['00:12','00:17','00:22'][i]:kind==='dialogue'?['Anna','Ben','Anna'][i]:'0'+(i+1))+'</span><div contenteditable>'+s+'</div></div>').join('');}else if(kind==='scenario'){b+='<div class="stack" style="margin-top:22px"><label>场景背景<textarea>It is late at night. You arrive at a hotel without a reservation.</textarea></label><label>你的角色<input value="A traveller checking in"></label><label>沟通目标<input value="Book a quiet room for two nights and ask about breakfast."></label></div>';}else b+='<div class="reading" contenteditable aria-label="章节正文"><p>Once when I was six years old I saw a magnificent picture in a book about the primeval forest. It was a picture of a boa constrictor in the act of swallowing an animal.</p><p>I pondered deeply, then, over the adventures of the jungle. And after some work with a coloured pencil I succeeded in making my first drawing.</p></div><div class="row between"><span class="small muted">保留段落、引号与标点</span><button class="ghost" onclick="alert(\'设计说明：展开只读原文，对照校对稿；恢复原文需确认。\')">对照原文</button></div>';b+='</article><aside class="properties"><h3 style="margin-bottom:18px">整理材料</h3><label>标题<input value="'+({reading:'The Little Prince',wordbook:'旅行常用词',video:'A day in London',dialogue:'At the coffee shop',sentences:'Everyday expressions',scenario:'Hotel check-in'}[kind])+'"></label><div class="stack"><label>材料类型<select aria-label="材料类型" onchange="setKind(this.value)">'+Object.entries(typeNames).map(([k,v])=>'<option value="'+k+'" '+(k===kind?'selected':'')+'>'+v+'</option>').join('')+'</select></label><label>难度<select><option>初级 · A1–A2</option><option selected>中级 · B1–B2</option><option>高级 · C1–C2</option></select></label></div><label>标签<div class="tags"><button class="tag" onclick="this.remove()">日常英语 ×</button><button class="tag" onclick="this.remove()">阅读 ×</button></div><input aria-label="添加标签" placeholder="输入标签，按 Enter 添加" onkeydown="if(event.key===\'Enter\'&&this.value.trim()){event.preventDefault();const el=document.createElement(\'button\');el.className=\'tag\';el.textContent=this.value+\' ×\';el.onclick=()=>el.remove();this.previousElementSibling.append(el);this.value=\'\';}"></label><p class="small muted">常用标签</p><div class="tags"><button class="outline small" onclick="this.classList.toggle(\'tag\')">职场</button><button class="outline small" oncli

name: Text learning cycle

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: text-learning-cycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  practice:
    name: Text cycle - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-latest]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build
      - name: Install Chromium on Windows
        if: runner.os == 'Windows'
        run: pnpm exec playwright install chromium
      - name: Install Chromium and WebKit
        if: runner.os != 'Windows'
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Exercise this build's learning cycle and storage
        run: pnpm exec playwright test --config playwright.text-cycle.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: text-cycle-${{ matrix.os }}
          path: test-results/
          retention-days: 7
